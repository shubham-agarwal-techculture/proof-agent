# ProofAgent — walking skeleton (Phase 9)
#
# The TRUSTED CORE has NO external dependencies on purpose (invariant #1: keep the trusted
# base small and auditable).  The gate uses only Lean core, so this project builds in seconds.
#
# When the *pipeline* (not the gate) needs Mathlib, uncomment the require below and add the
# matching `import Mathlib...` lines.  Pinned to the toolchain in ./lean-toolchain.
#
# [[require]]
# name = "mathlib"
# scope = "leanprover-community"
# rev = "v4.35.0"

name = "proof_agent"
version = "0.1.0"
defaultTargets = ["ProofAgent"]

[[lean_lib]]
name = "ProofAgent"

# The tool server: `lake exe checkServer` reads {"id","source"} JSON lines on stdin and writes
# {"id","ok","diagnostics"} JSON lines on stdout (see ProofAgent/Tools/CheckServer.lean).
[[lean_exe]]
name = "checkServer"
root = "ProofAgent.Tools.CheckServer"
